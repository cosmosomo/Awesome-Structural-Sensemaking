name: check

on:
  push:
  pull_request:

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      # 校验 catalog 数据和文档里的相对链接；文档里生成的表格过期则失败
      - run: python scripts/build.py --check

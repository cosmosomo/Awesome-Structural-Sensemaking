# 第四板块：结构提炼与认知建模相关的工具与项目。
# 信息来自 2026-10 调研报告，未逐项核验。

# ---- 结构提取 ----
- id: tree-sitter
  name: Tree-sitter
  section: cognition
  category: information-extraction
  kind: library
  summary: "程序源代码的语法树与增量解析。"
  focus: "输入是源码。语法事实不直接等于架构语义。"
  repo: https://github.com/tree-sitter/tree-sitter
  demo: https://tree-sitter.github.io/tree-sitter/7-playground.html
  demo_source: search

- id: docling
  name: Docling
  section: cognition
  category: information-extraction
  kind: library
  summary: "PDF、文档等的版面、标题、表格及文档结构提取。"
  focus: "输入是文档。文档结构不等于知识结构。"
  repo: https://github.com/docling-project/docling
  demo: https://huggingface.co/spaces/docling-project/SmolDocling-256M-Demo
  demo_source: search
  notes: "展示页是 SmolDocling 视觉语言模型的演示，不是 Docling 库本身。"

- id: docling-graph
  name: Docling Graph
  section: cognition
  category: information-extraction
  kind: library
  summary: "从结构化文档内容进一步提取结构化实体与关系。"
  focus: "需要约束关系类型和语义准确性。"
  repo: https://github.com/docling-project/docling-graph

# ---- 多层知识建模 ----
- id: graphrag
  name: Microsoft GraphRAG
  section: cognition
  category: multilevel-knowledge-modeling
  kind: library
  summary: "对非结构化文本做实体关系抽取、社区分层、社区摘要。"
  focus: "路径：文本片段、实体关系与声明提取、图社区发现与层级聚类、各层级社区摘要、全局与局部检索。图社区层级不等于认知的逻辑抽象层级，只能作为辅助，不能替代语义分层。"
  repo: https://github.com/microsoft/graphrag
  status: maintenance-mode
  notes: "官方文档显示仓库主要处于维护模式，适合作为研究参考，不能默认仍在持续扩展新功能。官方可视化指南建议把图导出为 GraphML 后用 Gephi 查看，没有专门的可视化器。"
  site: https://microsoft.github.io/graphrag/
  docs: https://microsoft.github.io/graphrag/visualization_guide/

- id: lightrag
  name: LightRAG
  section: cognition
  category: multilevel-knowledge-modeling
  kind: library
  summary: "图结构检索与知识网络可视化。"
  focus: "检索结构与认知模型并不完全相同。"
  repo: https://github.com/HKUDS/LightRAG

# ---- 动态与演化的知识结构 ----
- id: graphiti
  name: Graphiti
  section: cognition
  category: evolving-knowledge-structures
  kind: library
  summary: "带时间属性的实体和关系，保留来源。"
  focus: "时间化事实、原始 Episode、增量知识更新、显式或学习得到的关系类型；能区分“过去成立”“现在成立”和“存在冲突”。"
  repo: https://github.com/getzep/graphiti

  repo: https://github.com/FlowiseAI/Flowise
  status: deprecated
  notes: "官网 flowiseai.com/sunset 宣布停止运营：2026-07-29 代码冻结，2026-08-10 仓库转为公共归档，2026-08-31 终止支持；代码仍为 Apache 2.0，可自行 fork（2026-10-13 访问）。页面仍用将来时，仓库当前是否已归档需在 GitHub 上核实。"

  demo_checked: "2026-10-13"

- id: n8n
  name: n8n
  level: L3
  category: ai-development-platforms
  kind: platform
  summary: "通用业务自动化及 AI 工作流。"
  focus: "自动化流程设计与执行诊断；节点编辑、运行历史、失败定位、重新执行。"

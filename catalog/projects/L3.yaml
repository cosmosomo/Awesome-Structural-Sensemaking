  repo: https://github.com/node-red/node-red
  demo: https://flows.nodered.org/
  demo_source: search
  demo_checked: "2026-10-13"

- id: flowise
  name: Flowise
  level: L3
  category: ai-development-platforms
  kind: platform
  summary: "LLM、工具与 Agent 流程构建。"

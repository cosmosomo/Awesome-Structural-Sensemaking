# L3 成熟应用与综合交互系统。研究可视化在完整产品里的作用。
# 信息来自 2026-10 调研报告，未逐项核验。字段含义见 catalog/README.md。

# ---- AI 应用与工作流开发平台 ----
- id: dify
  name: Dify
  level: L3
  category: ai-development-platforms
  kind: platform
  summary: "构建、发布、运行 AI 应用。"
  focus: "工作流、知识检索及执行观察；节点编辑、测试、节点结果检查、应用管理。"
  repo: https://github.com/langgenius/dify
  access: custom-license
  notes: "官网自称 Source-available、Apache-2.0-derivative license（dify.ai，2026-10-13 访问）；具体附加条件在 GitHub 的 LICENSE 里，未核实。展示页是官方市场，含可复制的工作流模板。"
  site: https://dify.ai/
  demo: https://marketplace.dify.ai/
  demo_source: search
  demo_checked: "2026-10-13"

- id: langflow
  name: Langflow
  level: L3
  category: ai-development-platforms
  kind: platform
  summary: "构建和发布 Agent 工作流。"
  focus: "可视节点编排与执行测试；编辑、Playground、调试、API 发布的闭环。据官方文档可发布为 API 或 MCP 服务，并与可观测性平台集成。"
  repo: https://github.com/langflow-ai/langflow
  site: https://www.langflow.org/
  docs: https://docs.langflow.org/

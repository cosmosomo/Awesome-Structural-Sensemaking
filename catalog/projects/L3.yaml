# ---- 软件架构、开发者平台与工程管理 ----
- id: nx
  name: Nx
  level: L3
  category: software-engineering-platforms
  kind: platform
  summary: "Monorepo 构建与任务管理。"
  focus: "把组成结构和任务结构分开：Project Graph 表示项目间依赖，Task Graph 表示实际构建任务及执行依赖。可聚焦项目、查看邻近项目、按文件夹分组、分析影响范围、导出图数据。"
  docs: https://nx.dev/docs/features/explore-graph
  repo: https://github.com/nrwl/nx
  demo: https://nx.dev/docs/features/explore-graph
  demo_source: search
  notes: "展示页是官方文档页，据检索页面内嵌可交互的项目图示例，由 JS 加载，渲染情况未确认。"

- id: backstage
  name: Backstage
  level: L3
  category: software-engineering-platforms
  kind: platform
  summary: "开发者门户与软件服务目录。"
  focus: "Catalog Graph：实体中心视角，按关系和实体类别筛选，控制展开深度、方向和连线合并，并与实体详情联动。"
  docs: https://backstage.io/docs/next/getting-started/viewing-entity-relationships/
  repo: https://github.com/backstage/backstage
  notes: "官方强调服务目录反映的是便于人理解的组织与软件模型，而不是所有实时关系的唯一真实来源。公开 Demo 站点上是否启用了关系图未确认。"
  demo: https://demo.backstage.io/catalog
  demo_source: search
  demo_checked: "2026-10-13"


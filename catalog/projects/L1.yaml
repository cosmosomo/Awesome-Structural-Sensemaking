  demo: https://g6.antv.antgroup.com/manual/behavior/collapse-expand
  repo: https://github.com/antvis/G6
  added_by_maintainer: [repo]
  demo_source: report

- id: react-flow
  name: React Flow
  level: L1
  category: graph-and-node-engines

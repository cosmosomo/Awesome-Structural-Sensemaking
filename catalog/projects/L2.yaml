- id: aerograph
  name: AeroGraph
  level: L2
  category: traces-and-timelines
  kind: tool
  summary: "面向自主 AI 工作流的调试与观测层：本地优先、只追加、可安全回放的存储。"
  focus: "ReactFlow 的 Trace 图，支持逐步回放和失败高亮；可从任意 span 分叉出另一条时间线，并用 Myers diff 比较两次运行在哪里分岔；追踪循环和幻觉式的 Agent 交接。"
  repo: https://github.com/sgcpu/aerograph
  added_by_maintainer: [repo]
  notes: "不在调研报告里，来自前期收集，信息取自搜索到的 GitHub README。是早期的小众项目，成熟度和循环检测的实现方式未核实。"

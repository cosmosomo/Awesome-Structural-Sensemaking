# L2 特定结构与数据的专项可视化项目。
# 信息来自 2026-10 调研报告，未逐项核验。字段含义见 catalog/README.md。

# ---- 代码依赖与模块解耦 ----
- id: dependency-cruiser
  name: dependency-cruiser
  level: L2
  category: code-dependencies
  kind: tool
  summary: "JavaScript/TypeScript 模块依赖分析。"
  focus: "依赖图、架构边界规则、违规依赖诊断。"
  repo: https://github.com/sverweij/dependency-cruiser
  demo: https://sverweij.github.io/dependency-cruiser-repro-repo/458/
  demo_source: search
  site: https://sverweij.github.io/dependency-cruiser/
  notes: "展示页是作者的 3D 图报告插件演示（issue 458），用它自己的源码和 React 仓库生成。"

- id: madge
  name: Madge
  level: L2
  category: code-dependencies
  kind: tool
  summary: "JavaScript 模块引用分析。"
  focus: "自动生成依赖关系图、发现循环依赖。"
  repo: https://github.com/pahen/madge

- id: pydeps
  name: pydeps
  level: L2
  category: code-dependencies
  kind: tool
  summary: "Python 模块导入分析。"
  focus: "导入网络、模块聚类、依赖结构。"
  repo: https://github.com/thebjorn/pydeps

# ---- 软件架构与代码理解 ----
- id: codeboarding
  name: CodeBoarding
  level: L2
  category: software-architecture
  kind: tool
  summary: "源码结构及架构语义分析。"
  focus: "自动归纳组件，形成分层架构解释与可视化。"
  repo: https://github.com/CodeBoarding/CodeBoarding

- id: understand-anything
  name: Understand Anything
  level: L2
  category: software-architecture
  also: [L2/knowledge-and-cognition, L3/software-engineering-platforms, cognition/information-extraction]
  kind: tool
  summary: "文件、函数、类、调用关系与知识文档的交互知识图。"
  focus: "架构分层视图、业务领域视图、语义搜索、引导式理解、变更影响分析。对 Markdown 知识库先解析显式链接和类别，再借助模型发现隐式关系，生成带类型的知识网络。与“复杂认知地图”相关度高。"
  site: https://understand-anything.com/
  demo: https://understand-anything.com/
  repo: https://github.com/Egonex-AI/Understand-Anything
  notes: "以上能力来自项目文档的功能说明，未逐项做交互和输出准确率评测；据文档，结构事实部分采用 Tree-sitter 等确定性解析。"
  demo_source: report

- id: likec4
  name: LikeC4
  level: L2
  category: software-architecture
  also: [L1/diagram-languages, L3/software-engineering-platforms]
  kind: tool
  summary: "不限固定层级的架构模型、视角投影与交互展示。"
  focus: "模型与视图分离：一份结构模型生成不同范围、不同视角的图，可分层钻取。既有建模语言，也有架构可视化和完整的交互查看器。"
  site: https://likec4.dev/
  repo: https://github.com/likec4/likec4
  demo: https://likec4.dev/showcases/bigbank/
  demo_source: search

# ---- 流程、状态机与任务依赖 ----
- id: bpmn-js
  name: bpmn-js
  level: L2
  category: workflows-and-state-machines

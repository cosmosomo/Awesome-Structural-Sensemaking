# ---- Agent 与多智能体协作 ----
- id: agentensemble-viz
  name: AgentEnsemble Viz
  level: L2
  category: ai-and-multi-agent
  also: [L2/traces-and-timelines, L2/workflows-and-state-machines]
  kind: tool
  summary: "任务依赖 DAG 与实际执行 Trace 的双视图。"
  focus: "Flow View 看任务依赖、并发层级、关键路径；Timeline View 看真实起止时间、LLM 和工具调用。分别导出计划依赖 DAG 与执行 Trace。值得研究同一任务在两张视图中的身份如何保持一致，以及点击任务如何进入工具调用或会话详情。"
  docs: https://docs.agentensemble.net/guides/visualization/
  repo: https://github.com/AgentEnsemble/agentensemble

- id: agentprism
  name: AgentPrism
  level: L2
  category: ai-and-multi-agent
  also: [L2/traces-and-timelines]
  kind: library
  summary: "可嵌入应用的 React Agent Trace UI 组件。"
  focus: "层次化调用树、执行时间、工具与模型调用；独立可复用的 Trace UI 设计。"
  repo: https://github.com/evilmartians/agent-prism
  status: alpha
  notes: "项目公开标注为 Alpha。"
  demo: https://agent-prism.evilmartians.io/
  demo_source: search
  docs: https://evilmartians.com/chronicles/debug-ai-fast-agent-prism-open-source-library-visualize-agent-traces


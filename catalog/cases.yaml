# 案例分析：每个案例标出 领域 / 议题 / 数据结构类别 / 结构的哪一部分是重点 / 怎么可视化与交互。
# 编码（归类、重点部分的判断）是整理者做的，不是项目官方的说法；每条编码后面用 ev 指向官方页面里的原文摘录。
# 摘录在 case-evidence.json（子智能体逐字摘录，scripts/check_quotes.py 核对过原文是否在页面里）。
# 词表见 case-vocab.yaml，词表会随案例修订。
#
# 字段：
#   origin      project（在 projects/ 里，id 同项目 id）或 external（目录外的案例，要写 name 和 urls）
#   domain      领域
#   issue       这个案例的使用者要回答的问题（一句话，要能从 ev 的摘录里看出来）
#   issue_types 议题类型（词表 issue_types）
#   structure   数据结构类别，主类放第一位（词表 structures）
#   modifiers   结构修饰（词表 modifiers）
#   structure_was   第二轮编码改过主类或次类时，记下第一轮的写法
#   source      结构来源（词表 sources）：authored / recorded / derived / given，主要的放前面
#   structure_note  材料被建模成什么：对象是什么、关系是什么
#   focus       重点部分，主要的放前面（词表 focus_parts）
#   dropped     视图刻意没有表达的部分
#   forms       用到的图形，取 diagram-types.yaml 里的 id；没有对应的写在 views_note
#   schools     画法流派（词表 schools），主要的放前面；没有视图的案例写 []
#   views_note  其他视图形式
#   abstraction 抽象处理方式（词表 abstraction_modes）
#   abstraction_note  具体怎么处理层级和颗粒度
#   ev          证据：["类别:摘录里的一段文字", ...]，在 case-evidence.json 里按子串唯一匹配
#   confidence  编码的把握：high（官方页面直接写了）/ medium（页面信息支持，但归类靠推断）/ low（证据很少）
#   note        其他


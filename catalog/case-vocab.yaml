# 案例分析用的词表。整理者自拟，用来给案例编码；会随案例增加而修订，修订时要回头重看已编码的案例。
# 词表来自两部分：先从文献和已有分类里取一版初稿（见 04-structure-and-cognition/case-study/method.md），
# 再按案例里实际遇到的情况增删。每个词条的定义写的是本库里的用法，不等于文献里的定义。

# 议题：使用者想用这个结构回答什么问题（看的目的，不是对象本身）
issue_types:
  locate-anomaly: {title: 定位异常, desc: "找出哪里慢、哪里错、哪里不该有；通常要从结果往回追原因"}
  impact: {title: 影响范围, desc: "改动或故障会波及哪些对象；沿依赖方向往上游或下游追"}
  understand-whole: {title: 建立全貌, desc: "弄清整体由什么组成、各部分怎么关联；入门、接手、沟通用"}
  trace-flow: {title: 追踪流向, desc: "数据、资源、请求从哪来、到哪去；强调来源和去向"}
  compare: {title: 比较, desc: "比较版本、运行、方案、状态之间的差异"}
  decide-status: {title: 决策与状态, desc: "给每个对象一个状态或结论（采用、观察、停用），支持取舍"}
  explore-discover: {title: 探索发现, desc: "事先不知道要找什么，看有哪些群落、缺口、异常、规律"}
  reason-argue: {title: 论证推理, desc: "一个判断凭什么成立，有哪些支持和反对"}
  simulate: {title: 推演仿真, desc: "改变条件，看结果怎么变"}
  build-author: {title: 构建编辑, desc: "人来搭建或修改这个结构本身"}
  explain-teach: {title: 讲解传达, desc: "把已有的理解讲给别人"}
  retrieve: {title: 检索召回, desc: "按问题把相关的部分找出来"}

# 数据结构类别：材料被当成什么结构（主类放第一位，可带次要类）。
# 第二轮编码（2026-10-13）改动：去掉 text（文本是原料，不是结构：要看它被提取成什么）和 multilayer（它混了“嵌套”和“多视图”两件事，
# 前者用 hierarchy + graph 表达，后者归 abstraction 的 separate-views）；新增 propositional（见下）。
structures:
  set: {title: 集合与分类, desc: "成员加类别，没有显式的关系边；类别可有几层，但不表达成员之间的关系"}
  table: {title: 表与多维属性, desc: "对象乘以属性；没有显式关系，关系靠属性值相似产生。视图画的是表本身（平行坐标、分面、列表）时才是主类；画成投影位置的，主类是 spatial"}
  hierarchy: {title: 层级与树, desc: "每个对象至多一个上级；包含或父子关系；叶子可带数值"}
  dag: {title: 有向无环图, desc: "关系是先后、依赖或来源，环在语义上不可能或不被允许（任务依赖、血缘、提交历史、谱系）；一个对象可有多个上级或下游。页面没写是否有环的流程画布，按 graph 编码"}
  graph: {title: 一般图与网络, desc: "对象与关系；可有环、可无向、关系可分类型、对象可分类型、边与点可带属性"}
  propositional: {title: 命题与论证, desc: "对象是陈述（主张、依据、命题），关系是它们之间的认识关系（支持、反驳、保证、连接词）；关系本身常是内容，也可被质疑。整理者归纳的类，案例少（见 information-structure-theory.md）"}
  sequence: {title: 序列与事件流, desc: "按时间或顺序排列的事件、状态、记录"}
  flow: {title: 流量网络, desc: "边上带的量要守恒或可汇总；关心数量如何分配"}
  spatial: {title: 空间与几何, desc: "对象有位置（地理、版图、嵌入空间里的坐标）；位置本身有含义。降维或嵌入投影得到的二维、三维坐标归这一类，原始的“对象乘以属性”表放次类 table"}
  causal: {title: 因果与反馈, desc: "变量之间的影响，常含环与延迟"}

# 结构修饰：叠加在主类上的性质
modifiers:
  directed: 有方向
  cyclic: 含环
  typed: 对象或关系分类型
  weighted: 边或点带数值
  temporal: 带时间
  versioned: 有版本或有效期
  nested: 嵌套（复合）
  bipartite: 两类对象互相连接
  derived: 派生（结构由别的材料推出，不是原始给定）
  provenance: 保留来源与证据

# 重点部分：这个案例的视图主要在回答结构的哪一部分（可多选，主要的放前面）
focus_parts:
  membership: {title: 有什么, desc: "有哪些对象，属于哪类"}
  containment: {title: 包含与层次, desc: "谁包含谁、处于哪一层"}
  connectivity: {title: 连通与邻域, desc: "谁与谁相连，路径，周围有什么"}
  precedence: {title: 先后与依赖方向, desc: "谁先谁后，谁依赖谁，关键路径"}
  cycle: {title: 环与反馈, desc: "有没有环，环在哪里"}
  node_attr: {title: 对象上的度量, desc: "对象的状态、数值、指标"}
  edge_attr: {title: 关系上的类型与量, desc: "关系的种类、强弱、流量"}
  time: {title: 时间与演化, desc: "时间位置、耗时、版本、变化"}
  identity: {title: 跨视图的同一对象, desc: "同一个对象在不同视图、不同层之间保持可对应"}
  cluster: {title: 群落与相似, desc: "哪些对象聚成一群、彼此相似"}
  position: {title: 空间位置, desc: "位置本身含义（地理或嵌入）"}
  provenance: {title: 来源与证据, desc: "判断从哪来、凭什么"}
  distribution: {title: 总体分布, desc: "整体的比例、分布、规模"}

# 抽象处理：案例怎样处理层级和颗粒度
abstraction_modes:
  none: 没有处理（一个层级一张图）
  fold-drill: 折叠展开或钻取（同一视图里换层级）
  aggregate: 聚合（多个对象合成一个，量也合并）
  filter-scope: 过滤或限定范围（按类型、深度、邻域裁剪）
  separate-views: 分成多个视图，各看一个侧面
  zoom: 缩放（连续换尺度）
  summarize: 生成摘要或概括（语义概括，不只是合并）
  none-stated: 页面没写

# 画法流派：案例的视图主要用哪种方式把“重点部分”画出来（可多选，主要的放前面；没有视图的案例写 []）。
# 流派是从案例归纳的，定义写的是本库里的用法。一个案例常用到几种（例如 Jaeger：时间轴条图 + 连线图）。
schools:
  link: {title: 连线图, bet: "关系就是线，读者能顺着线走", cost: "规模：稠密时成“毛球”，位置本身没有含义", desc: "对象画成点，关系画成线。布局的含义有两种：流向布局（方向就是先后或依赖，如血缘、工作流）和聚类布局（靠近表示相关，如共现网络、关系网络）"}
  enclosure: {title: 包含与面积图, bet: "屏幕空间：包含表达“属于”，面积表达量", cost: "跨分支的关系；面积不易精确比较", desc: "用嵌套或相邻的块表达“属于”，用面积或宽度表达量：矩形树图、冰柱图与火焰图、分组块、城市隐喻里的街区"}
  timebar: {title: 时间轴条图, bet: "耗时看得见：条的长度是时间，缩进是父子", cost: "父子以外的依赖关系", desc: "横轴是时间，条的长度是耗时，缩进表达父子：trace 瀑布图、甘特图、时间线"}
  rulepos: {title: 规则布局, bet: "位置由数据的规则决定，布局可复现、可比较", cost: "位置的含义要向读者解释；关系类型单一", desc: "位置由数据的规则决定，而不是物理模拟的结果：矩阵的行列排序、辐射状轴、环形坐标、环与象限；让布局可复现、可比较"}
  channels: {title: 通道分配图, bet: "一张表的列分到位置、大小、颜色、时间等通道", cost: "对象之间的关系", desc: "把一张表的列分配给位置、大小、颜色、时间、宽度等视觉通道：散点与气泡图、桑基图、仪表盘面板、投影散点"}
  schematic: {title: 示意与隐喻图, bet: "保留一种性质，舍掉另一种；或借熟悉的东西作隐喻", cost: "被舍掉的性质（几何距离、精确尺度）", desc: "有意保留一种性质（拓扑、层次）、舍掉另一种（几何距离），或借熟悉的事物作隐喻：地铁示意图、城市、景观图、整棵树的缩放图"}
  textlist: {title: 列表与文字, bet: "结构留在文字里，能读、能搜、能排序", cost: "结构的整体形状", desc: "结构留在文字里：缩进列表、分栏、日志、正文里的链接、卡片"}
  notation: {title: 记法图, bet: "意义放在符号里，布局可以自由", cost: "读者要先学记法；细节被隐藏", desc: "先规定一套形状、线型、颜色的含义，再按它画；意义放在符号里，布局可以自由：BPMN、SBGN、VOWL、C4、图尔敏模型、论证图、概念图"}

# 结构来源：这份结构是怎么进到系统里的（可多选，主要的放前面）。
sources:
  authored: {title: 手工建构, desc: "人把结构画出来、写出来：图、模型、清单、判断、论证、笔记"}
  recorded: {title: 运行记录, desc: "系统运行时留下的记录：trace、执行、提交、事件流"}
  derived: {title: 算出来的, desc: "从代码、文本、文档、表、向量里解析、聚合、抽取或投影得到"}
  given: {title: 现成数据, desc: "已经以数据形式存在的数据集、查询结果、统计、策展库"}

# 领域大类：案例放在哪个领域里（cases.yaml 的 field，同时也是 cases.yaml 里的分段）。
# 判断标准是“使用者是谁、要处理的材料来自哪个行业”，不是项目怎么来的（目录内项目还是后补的案例）。
# 每个案例只归一个大类；更细的说法写在它自己的 domain 里。顺序就是 cases.yaml 里的顺序。
fields:
  code: {title: "软件工程：代码、架构与历史", desc: "材料是代码、依赖、模块、提交历史；使用者是写和维护软件的人"}
  observability: {title: "运行观测：分布式系统与 AI 应用", desc: "材料是运行时留下的 trace、指标、服务拓扑和性能样本；使用者在找哪里慢、哪里错"}
  orchestration: {title: "工作流、自动化与 Agent 编排", desc: "人搭一张流程或 Agent 的图并让它运行；结构本身就是被编辑的对象"}
  modeling: {title: "通用绘图与系统建模", desc: "不限行业的画图工具，以及把一个系统的部件和关系建成模型的工具"}
  data: {title: "数据、元数据与分析工具", desc: "数据血缘、元数据目录、图数据库看板、网络与嵌入分析；使用者是数据工程师和分析师"}
  geometry: {title: "空间、几何与沉浸式载体", desc: "超出平面屏幕的空间：高维几何的截面、VR 里的数据轴、非欧几何；材料是几何或空间，问题是人怎么接触它"}
  knowledge: {title: "知识抽取、知识图谱与本体", desc: "从文本、文档、语料里抽出结构，或查询和展示已有的知识图谱与本体"}
  cognition: {title: "认知、写作与教育", desc: "笔记、导图、论证、讲解与写作；材料是人的想法，结构是理解本身"}
  ecosystem: {title: "开源与技术生态", desc: "技术选型的地图与雷达、开源仓库的度量、依赖与知识图谱、仓库的分类与语义地图"}
  life: {title: "生命科学", desc: "基因组、物种、分子通路与流行病；材料是科学数据，使用者是研究者"}
  society: {title: "社会、经济与公共数据", desc: "交通、能源、金融、国际统计与家族谱系；材料来自公共或行业数据"}

# 维度处理：数据（或几何）的维度比屏幕的位置轴多时，案例怎样处理（可多选，主要的放前面；只给确实有这个问题的案例标）。
# 从高维可视化的 16 个新案例归纳（2026-10-14；另有 4 个原有案例补标），再对照文献里的分类（Keim 2002 的技术分类；Liu 等 2015 的“数据变换、视觉映射、视图变换”）调整过名字；
# 定义写的是本库里的用法，对应文献里哪一类见 01-theory/high-dimensional.md。
dim_modes:
  project: {title: 降维投影, desc: "把多维压成二到三个位置轴：PCA、t-SNE、UMAP 等；线性投影的轴有含义，非线性投影的邻域较可信但距离和大小没有含义"}
  axes: {title: 复用轴, desc: "不降维，每个维度一根轴，并排（平行坐标）或围成圆（Radviz）；所有维度同时可见，代价是线的交叉和轴的顺序"}
  encode: {title: 多通道编码, desc: "把维度分到位置之外的通道：颜色、大小、形状、分面、动画时间；一张图能容纳的维度数受通道数限制"}
  juxtapose: {title: 并置多视图, desc: "一次画很多低维视图：小多图、散点矩阵、逐特征总览；联动刷选把它们连起来"}
  slice: {title: 切片与截面, desc: "固定其余维度，只看一个低维子空间，并提供换子空间的操作：四维世界的三维截面、轴范围筛选"}
  tour: {title: 巡游, desc: "沿一串连续变化的投影或截面做动画，让人从运动里推断高维形状；点的身份要在帧之间保持"}
  rank: {title: 排序与推荐, desc: "可能的视图太多（组合爆炸）时，由系统打分、排序、推荐，人只看靠前的"}
  summarize: {title: 先摘要再画, desc: "先把高维数据变成更小的结构（聚类、集合交集、拓扑图），再画这个结构；高维本身不再出现在画面里"}
  immerse: {title: 换载体, desc: "借 VR、AR 或身体操作多给人一个空间维度和一组手势；不改变数据维度，改变人接触它的方式"}
  warp: {title: 换空间, desc: "不加维度，改用非欧几何（双曲平面）给指数增长的结构更多空间；放在这里是边界案例"}
